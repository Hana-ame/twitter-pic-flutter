name: twitter_pic_flutter
description: "A Flutter project for Twitter image browsing."
publish_to: 'none'
version: 0.5.5+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  ffi: ^2.2.0          # using/Arena/Utf8 在 2.x 中仍可用，无需更改代码
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1  # 磁盘+内存二级缓存 + 降采样解码
  dio: ^5.7.0                    # 网络层：超时控制、拦截器、结构化异常
  # 边下边播（系统播放器/ExoPlayer 播本地流）真机不可行已移除；
  # 下载完成原地播放用 video_player（Windows 由 video_player_win 实现，
  # federated 自动注册，无需手动 registerWith）。
  video_player: ^2.9.0
  video_player_win: ^3.2.2
  share_plus: ^10.0.0                    # 分享图片/视频到系统应用
  # 封面（静帧）当初用 video_thumbnail（git fork v0.5.6-flutter44，仅为
  # Gradle 9/AGP 9 兼容）从视频里抽帧，现已**移除该依赖**：
  #   1. 它走 MediaMetadataRetriever，自己也要占一个硬件解码器 —— 而本项目
  #      正因为解码器不够用才要限制并发（见 doc/troubleshooting.md 案例 14）；
  #   2. 现在改成抓屏（RepaintBoundary.toImage，见 services/poster_service.dart），
  #      不额外占解码器，桌面端也能用。
  # 若真机上发现抓屏抓不到 Texture（整片黑，poster_service 有黑帧检查会放弃），
  # 再把这个 fork 加回来当兜底。

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.1
  # 测试 StorageService 时 mock path_provider 平台通道
  path_provider_platform_interface: ^2.1.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#15202B"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
