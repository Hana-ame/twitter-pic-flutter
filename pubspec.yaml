name: twitter_pic_flutter
description: "A Flutter project for Twitter image browsing."
publish_to: 'none'
version: 0.2.8+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  ffi: ^2.2.0          # using/Arena/Utf8 在 2.x 中仍可用，无需更改代码
  path_provider: ^2.1.5
  # 边下边播：下载中调系统播放器播本地流（open_filex 打开 http URL）；
  # 下载完成原地播放用 video_player（Windows 由 video_player_win 实现，
  # federated 自动注册，无需手动 registerWith）。
  open_filex: ^4.5.0
  video_player: ^2.9.0
  video_player_win: ^3.2.2
  # 封面抽帧：仅 Android/iOS 有实现，桌面平台在代码里跳过。
  # 用 fork（v0.5.6-flutter44）：原版 0.5.6 的 Android gradle 是远古写法
  # （AGP 4.1 classpath + jcenter + 老 DSL），在 Flutter 3.44 模板的
  # Gradle 9 / AGP 9 下无法构建。fork 仅改 gradle 文件，Java 实现不变。
  video_thumbnail:
    git:
      url: https://github.com/Hana-ame/video_thumbnail
      ref: v0.5.6-flutter44

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#15202B"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
