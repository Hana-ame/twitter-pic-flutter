<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitter Pic - ECH Proxy</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header { padding: 20px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; }
header h1 { font-size: 18px; }
.status { padding: 10px 15px; border-radius: 8px; margin: 15px 0; font-size: 14px; }
.status.ok { background: #1a3a1a; border: 1px solid #2a5a2a; color: #4caf50; }
.status.err { background: #3a1a1a; border: 1px solid #5a2a2a; color: #f44336; }
.search-box { display: flex; gap: 10px; margin: 20px 0; }
input { flex: 1; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 16px; }
button { padding: 12px 24px; background: #1d9bf0; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
button:hover { background: #1a8cd8; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
.card { background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
.card img { width: 100%; height: 200px; object-fit: cover; }
.card video { width: 100%; height: 200px; background: #000; }
.card-info { padding: 10px; }
.card-info .username { font-weight: bold; color: #1d9bf0; }
.log { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-top: 20px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; }
.log-line { padding: 2px 0; border-bottom: 1px solid #222; }
.empty { text-align: center; padding: 60px 20px; color: #666; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🐦 Twitter Pic - ECH Proxy</h1>
  </header>
  
  <div id="status" class="status ok">✅ Proxy running</div>
  
  <div class="search-box">
    <input type="text" id="search" placeholder="Search Twitter username..." />
    <button onclick="search()">Search</button>
  </div>
  
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">Enter a username to start</div>
  
  <details style="margin-top: 20px;">
    <summary style="cursor: pointer; color: #666;">Proxy Logs</summary>
    <div id="log" class="log"></div>
  </details>
</div>

<script>
const API_BASE = '/api';
// CDN 路径直接转发到 video-cf.twimg.com（不带域名前缀）
// 例：/media/ABC123.png → https://video-cf.twimg.com/media/ABC123.png

async function search() {
  const username = document.getElementById('search').value.trim();
  if (!username) return;
  
  document.getElementById('empty').style.display = 'none';
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="empty">Loading...</div>';
  
  try {
    const resp = await fetch(`${API_BASE}/twitter/users/${encodeURIComponent(username)}/media`);
    const data = await resp.json();
    
    grid.innerHTML = '';
    if (!data.media || data.media.length === 0) {
      grid.innerHTML = '<div class="empty">No media found</div>';
      return;
    }
    
    for (const item of data.media) {
      const card = document.createElement('div');
      card.className = 'card';
      
      let html = '';
      if (item.type === 'video') {
        html = `<video controls preload="metadata"><source src="/${item.path}"></video>`;
      } else {
        html = `<img src="/${item.path}" loading="lazy">`;
      }
      
      card.innerHTML = `
        ${html}
        <div class="card-info">
          <div class="username">@${item.username || username}</div>
        </div>
      `;
      grid.appendChild(card);
    }
  } catch (e) {
    grid.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

document.getElementById('search').addEventListener('keypress', e => {
  if (e.key === 'Enter') search();
});

// Load logs
async function loadLogs() {
  try {
    const resp = await fetch('/logs');
    const text = await resp.text();
    document.getElementById('log').innerHTML = text.split('\n').map(l => `<div class="log-line">${l}</div>`).join('');
  } catch (e) {}
}
setInterval(loadLogs, 5000);
</script>
</body>
</html>
