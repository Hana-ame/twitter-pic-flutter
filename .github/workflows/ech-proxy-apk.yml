name: Build ech-proxy APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build ech-proxy Android library
        run: |
          cd ./ech-proxy
          go mod tidy
          mkdir -p ../ech-proxy-android/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang \
            go build -buildmode=c-shared -ldflags="-s -w" \
            -o ../ech-proxy-android/app/src/main/jniLibs/arm64-v8a/libechproxy.so \
            ./cmd/ech-proxy-android/
          ls -lh ../ech-proxy-android/app/src/main/jniLibs/arm64-v8a/libechproxy.so

      - name: Build Android APK
        run: |
          cd ech-proxy-android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ech-proxy-android
          path: ech-proxy-android/app/build/outputs/apk/debug/*.apk

  release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
