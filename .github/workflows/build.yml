# Build & Release - 自动构建 Android APK 和 Windows ZIP，不可删除。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 同一个 ref 的新一轮构建取消上一轮：连续推 tag 曾让两个 7 分钟的构建并行
# 跑完（v0.5.6 有两次 cancelled 记录）。不同 ref 之间互不影响，所以不会
# 因为推了 v0.5.10 就打断正在跑的 v0.5.9。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单元测试：发布前强制执行（create_release 依赖本 job）。
  flutter_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.3

      - name: Create Flutter project scaffold
        run: |
          flutter create --project-name twitter_pic_flutter /tmp/test_project
          cp pubspec.yaml /tmp/test_project/pubspec.yaml
          # flutter create 会生成自己的 analysis_options.yaml；不覆盖的话下面
          # 的 analyze 用的是 Flutter 默认规则而不是本项目的（本地和 CI 不一致，
          # 等于本地绿、CI 未必绿）。
          cp -f analysis_options.yaml /tmp/test_project/analysis_options.yaml 2>/dev/null || true
          rm -rf /tmp/test_project/lib /tmp/test_project/test
          cp -r lib /tmp/test_project/lib
          cp -r test /tmp/test_project/test

      - name: Install dependencies
        run: |
          cd /tmp/test_project
          flutter pub get

      - name: Static analysis (quality gate)
        run: |
          cd /tmp/test_project
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: |
          cd /tmp/test_project
          flutter test --coverage

      # 覆盖率数据一直生成后就被丢弃了，无从追踪退化。先攒着：等基线稳定
      # 了再加成门槛（现在不知道基线多少，直接加门槛只会挡住真改动）。
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: /tmp/test_project/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30

  build_android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        run: |
          NDK_VERSION="r27"
          curl -L -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/
          echo "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build ECH shared library (arm64)
        run: |
          NDK_VERSION="r27"
          cd ech-proxy
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm64 \
          CC=aarch64-linux-android21-clang \
          go build -buildmode=c-shared -ldflags="-s -w" \
          -o /tmp/libechproxy.so ./cmd/ech-flutter-shared/
          /tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy --strip-unneeded /tmp/libechproxy.so
          ls -lh /tmp/libechproxy.so

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.3

      - name: Create Flutter project scaffold
        run: |
          flutter create --project-name twitter_pic_flutter /tmp/build_project
          cp pubspec.yaml /tmp/build_project/pubspec.yaml
          rm -rf /tmp/build_project/lib/
          cp -r lib /tmp/build_project/lib
          rm -rf /tmp/build_project/assets/
          cp -r assets /tmp/build_project/assets

      - name: Set application package to xyz.moonchan.twitterpic
        run: |
          cd /tmp/build_project
          GRADLE=$(ls android/app/build.gradle* | head -1)
          # namespace / applicationId（兼容 groovy 与 kts 两种写法；
          # 捕获前置符保留原分隔符，避免 kts 的 = 被吞掉）
          sed -Ei 's|(namespace[ =]*)("com\.example\.twitter_pic_flutter")|\1"xyz.moonchan.twitterpic"|' "$GRADLE"
          sed -Ei 's|(applicationId[ =]*)("com\.example\.twitter_pic_flutter")|\1"xyz.moonchan.twitterpic"|' "$GRADLE"
          # MainActivity 移动到新包路径并改 package 声明
          MAIN=$(find android/app/src/main -name "MainActivity.*" | head -1)
          if [ -n "$MAIN" ]; then
            REL=${MAIN#android/app/src/main/}
            KIND=$(echo "$REL" | cut -d/ -f1)   # kotlin | java
            NEW=android/app/src/main/$KIND/xyz/moonchan/twitterpic/MainActivity.kt
            if [ "$KIND" = java ]; then NEW=android/app/src/main/$KIND/xyz/moonchan/twitterpic/MainActivity.java; fi
            mkdir -p "$(dirname "$NEW")"
            mv "$MAIN" "$NEW"
            sed -i 's|^package .*|package xyz.moonchan.twitterpic|' "$NEW"
          fi
          # 校验：包名注入失败则 CI 报错，避免产出旧包名 APK
          grep -q 'xyz.moonchan.twitterpic' "$GRADLE" || { echo "::error::package injection failed"; exit 1; }
          grep -q 'xyz.moonchan.twitterpic' "$NEW" || { echo "::error::MainActivity package update failed"; exit 1; }

      - name: Ensure INTERNET permission and set app label in AndroidManifest
        run: |
          MANIFEST=/tmp/build_project/android/app/src/main/AndroidManifest.xml
          # 在任意 <manifest ...> 行后插入，不依赖精确的属性顺序——Flutter
          # 生成的 manifest 若带 xmlns:tools 等额外属性，精确匹配会静默
          # no-op 而 CI 仍显示绿。
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/s|.*|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$MANIFEST"
          fi
          sed -i 's|android:label="[^"]*"|android:label="推图"|' "$MANIFEST"
          # API/图片/视频全部经 http://127.0.0.1:<port> 本机代理。Android 9+
          # （targetSdk 28+）默认禁明文，不注入该属性时所有代理请求会被系统
          # 静默拒绝（表现为"暂无内容"），CI 却全绿。
          if ! grep -q 'android:usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          grep -q 'android:usesCleartextTraffic="true"' "$MANIFEST" || { echo "::error::usesCleartextTraffic injection failed"; exit 1; }
          # 后置校验：缺 INTERNET 权限的 APK 静默无法联网，CI 却全绿。
          grep -q 'android.permission.INTERNET' "$MANIFEST" || { echo "::error::INTERNET permission injection failed"; exit 1; }

      - name: Place ECH shared library
        run: |
          mkdir -p /tmp/build_project/android/app/src/main/jniLibs/arm64-v8a
          cp /tmp/libechproxy.so /tmp/build_project/android/app/src/main/jniLibs/arm64-v8a/libechproxy.so

      - name: Generate launcher icons
        run: |
          cd /tmp/build_project
          flutter pub get
          dart run flutter_launcher_icons

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Configure signing
        run: |
          cat > /tmp/build_project/android/key.properties << 'EOF'
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=release
          storeFile=/tmp/release.keystore
          EOF

          cat > /tmp/build_project/android/gradle.properties << 'EOF'
          android.injected.signing.store.file=/tmp/release.keystore
          android.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }}
          android.injected.signing.key.alias=release
          android.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Set unique version
        run: |
          # 版本号来自 tag；main 分支/workflow_dispatch 触发时 ref_name 不是
          # 合法版本（如 "main"），回退读 pubspec 原版本，避免写出
          # "main+230" 这类非法版本号导致 flutter build 直接失败。
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            # 日期 tag（vYYYYMMDD.HHMMSS）转成合法三段版本号 YYYYMMDD.0.HHMMSS
            if [[ "$VERSION" =~ ^([0-9]{8})\.([0-9]{6})$ ]]; then
              VERSION="${BASH_REMATCH[1]}.0.${BASH_REMATCH[2]}"
            fi
          else
            VERSION=$(grep '^version:' /tmp/build_project/pubspec.yaml | sed 's/^version: *//' | sed 's/+.*//')
          fi
          RN=${{ github.run_number }}
          sed -i "s/^version:.*/version: ${VERSION}+${RN}/" /tmp/build_project/pubspec.yaml

      - name: Build APK
        env:
          GRADLE_OPTS: -Xmx2g -Dorg.gradle.jvmargs=-Xmx2g
        run: |
          cd /tmp/build_project
          BUILD_NUM=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          flutter build apk --release --target-platform android-arm64 --dart-define=BUILD_NUM="$BUILD_NUM"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: /tmp/build_project/build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build ECH shared library (windows)
        run: |
          Push-Location ech-proxy
          go build -buildmode=c-shared -ldflags="-s -w" -o C:\tmp\echproxy_amd64.dll ./cmd/ech-flutter-shared/
          Pop-Location

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.3

      - name: Create Flutter project scaffold
        run: |
          flutter create --project-name twitter_pic_flutter C:\tmp\build_project
          Copy-Item -Force -Path "$env:GITHUB_WORKSPACE\pubspec.yaml" -Destination "C:\tmp\build_project\pubspec.yaml"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\tmp\build_project\lib"
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\lib" "C:\tmp\build_project\lib"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\tmp\build_project\assets"
           Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\assets" "C:\tmp\build_project\assets"

      - name: Set unique version
        shell: powershell
        run: |
          # 版本号来自 tag；main 分支/workflow_dispatch 触发时回退读 pubspec
          # 原版本（同 Linux 版，避免 "main+230" 非法版本号）。
          $content = Get-Content C:\tmp\build_project\pubspec.yaml -Raw
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/v*') {
            $version = "${{ github.ref_name }}".TrimStart('v')
            # 日期 tag（vYYYYMMDD.HHMMSS）转成合法三段版本号 YYYYMMDD.0.HHMMSS
            if ($version -match '^(\d{8})\.(\d{6})$') {
              $version = "$($matches[1]).0.$($matches[2])"
            }
          } else {
            $version = ((Select-String '^version:' C:\tmp\build_project\pubspec.yaml).Line -replace 'version: *' -replace '\+.*')
          }
          $rn = "${{ github.run_number }}"
          $content = $content -replace '^version:.*', "version: $version+$rn"
          Set-Content C:\tmp\build_project\pubspec.yaml -Value $content

      - name: Build Windows Release
        run: |
          $projDir = "C:\tmp\build_project"

          Push-Location $projDir
          flutter pub get
          Pop-Location

          # patch window title in main.cpp (use absolute paths everywhere)
          $mainCpp = "$projDir\windows\runner\main.cpp"
          $ver = (Select-String '^version:' "$projDir\pubspec.yaml").Line -replace 'version: *'
          (Get-Content $mainCpp -Raw) -replace 'window\.SetTitle\(L"[^"]*"\)', "window.SetTitle(L""Twitter Pic v$ver"")" | Set-Content $mainCpp

          # try flutter_launcher_icons first
          Push-Location $projDir
          dart run flutter_launcher_icons
          Pop-Location

          # find any .ico that flutter_launcher_icons generated and copy to runner.ico
          $icoCandidates = Get-ChildItem -Path "$projDir\windows" -Filter *.ico -Recurse -ErrorAction SilentlyContinue
          if ($icoCandidates) {
            $icoCandidates | ForEach-Object { Write-Host "found ico: $($_.FullName)" }
            Copy-Item -Force $icoCandidates[0].FullName "$projDir\windows\runner\runner.ico"
          }
          # if still no runner.ico, fall back to Python/pillow
          if (-not (Test-Path "$projDir\windows\runner\runner.ico")) {
            Write-Host "no .ico found — trying Python pillow"
            python -c "from PIL import Image; img = Image.open(r'$projDir\assets\icon.png').resize((256,256)); img.save(r'$projDir\windows\runner\runner.ico', format='ICO', sizes=[(256,256)])" 2>$null
          }
          # last resort: create ICO manually with correct ICO BMP format
          if (-not (Test-Path "$projDir\windows\runner\runner.ico")) {
            Write-Host "generating runner.ico manually (BMP inside ICO)"
            Add-Type -AssemblyName System.Drawing | Out-Null
            $icoDir = "$projDir\windows\runner"
            if (-not (Test-Path $icoDir)) { New-Item -ItemType Directory -Path $icoDir -Force | Out-Null }
            $src = [System.Drawing.Image]::FromFile("$projDir\assets\icon.png")
            $bm = New-Object System.Drawing.Bitmap 256,256
            $g = [System.Drawing.Graphics]::FromImage($bm)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($src, 0, 0, 256, 256); $g.Dispose()
            $ms = New-Object System.IO.MemoryStream
            $bm.Save($ms, [System.Drawing.Imaging.ImageFormat]::Bmp)
            $raw = $ms.ToArray(); $ms.Dispose(); $bm.Dispose(); $src.Dispose()
            $hdrSize = [BitConverter]::ToInt32($raw, 14)  # biSize
            Write-Host "BMP biSize=$hdrSize actualLen=$($raw.Length)"
            $bmpData = $raw[14..($raw.Length-1)]
            # ICO: dwHeight must be 2x (XOR mask + AND mask)
            $bmpData[8] = 0  # override biHeight low byte to 0 (will set to 0 for 256)
            $bmpData[9] = 1  # override biHeight high byte to 1 → 256
            $bmpData[10] = 0; $bmpData[11] = 0  # not needed, just offset adjustment
            # Actually the height field is at bytes 22..25 from file start = 8..11 in BMP data
            # 256 in little-endian: 00 01 00 00. For ICO double: 00 02 00 00 = 512
            $bmpData[8] = 0; $bmpData[9] = 2; $bmpData[10] = 0; $bmpData[11] = 0
            $fs = [System.IO.File]::Open("$icoDir\runner.ico", [System.IO.FileMode]::Create)
            $w = New-Object System.IO.BinaryWriter($fs)
            $w.Write([UInt16]0); $w.Write([UInt16]1); $w.Write([UInt16]1)
            $w.Write([Byte]0); $w.Write([Byte]0); $w.Write([Byte]0); $w.Write([Byte]0)
            $w.Write([UInt16]1); $w.Write([UInt16]32)
            $w.Write([UInt32]$bmpData.Length); $w.Write([UInt32]22)
            $w.Write($bmpData)
            $w.Dispose(); $fs.Dispose()
          }

          # update Runner.rc to reference runner.ico
          $rc = "$projDir\windows\runner\Runner.rc"
          $rcContent = Get-Content $rc -Raw
          if ($rcContent -notmatch 'runner\.ico') {
            $rcContent = $rcContent -replace '"([^"]+\.ico)"', '"runner.ico"'
            Set-Content $rc -Value $rcContent
          }

          $BUILD_NUM = (Select-String '^version:' "$projDir\pubspec.yaml").Line -replace 'version: *'
          Push-Location $projDir
          flutter build windows --release --dart-define=BUILD_NUM="$BUILD_NUM"
          Pop-Location
          Copy-Item -Force -Path C:\tmp\echproxy_amd64.dll -Destination "$projDir\build\windows\x64\runner\Release\echproxy.dll"

      - name: Package Windows Release
        run: |
          Compress-Archive -Path "C:\tmp\build_project\build\windows\x64\runner\Release\*" -DestinationPath C:\tmp\twitter_pic_flutter_windows_amd64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: C:\tmp\twitter_pic_flutter_windows_amd64.zip

  create_release:
    runs-on: ubuntu-latest
    needs: [build_android, build_windows, flutter_test]
    # 只有 semver tag 才发 Release。日期 tag（vYYYYMMDD.HHMMSS）和 main
    # 分支/workflow_dispatch 的构建都只留 artifact（90 天），不进 Release
    # 列表 —— 之前没有这道门槛，163 个 Release 里 148 个是日期 tag，而且每个
    # 都 make_latest，把 Release 列表彻底淹了。
    if: ${{ github.ref_type == 'tag' && github.ref_name =~ '^v[0-9]+\.[0-9]+\.[0-9]+$' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: ./artifact/apk

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: ./artifact/windows

      - name: Generate release notes
        run: |
          REF="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          # 上一个版本 = 当前提交的父提交上最近的 **semver** tag。
          #
          # --match 必须带：tag 里混着大量日期 tag（vYYYYMMDD.HHMMSS），不滤掉
          # 的话 describe 会返回最近的日期 tag 而不是上一个 release，
          # 产出的 notes 范围完全不对。
          #
          # 也不用 gh release list：它按发布时间排序，且拿到的 tag 可能不在
          # 当前分支的祖先链上（日期 tag 就常常不在），git log 会 ambiguous
          # argument 然后静默 fallback 到最近 10 条 —— 产出一份和实际发布范围
          # 对不上的 notes。
          PREV_TAG=$(git describe --tags --abbrev=0 \
            --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null || echo "")
          {
            echo "## Release ${REF}"
            echo ""
            echo "Automated build from commit ${SHA}."
            echo ""
            echo "### 变更"
            if [ -n "$PREV_TAG" ]; then
              echo "（自 ${PREV_TAG} 起）"
              git log "$PREV_TAG..HEAD" --oneline --no-decorate
            else
              echo "（首次发布）"
              git log --oneline -10 --no-decorate
            fi
          } > /tmp/release_body.md

      - name: Get version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date +'%Y%m%d.%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: /tmp/release_body.md
          files: |
            ./artifact/apk/app-release.apk
            ./artifact/windows/twitter_pic_flutter_windows_amd64.zip
          generate_release_notes: false
          make_latest: true